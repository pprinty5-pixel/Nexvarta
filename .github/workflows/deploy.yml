name: Deploy Nexvarta

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy on VPS
        run: |
          set -e

          # Ensure Node, NPM, and PM2 are in PATH
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          export PATH=$PATH:/usr/local/bin:$HOME/.nvm/versions/node/v20.20.2/bin

          echo "🚀 Navigating to project directory..."
          cd /var/www/nexvarta

          echo "📥 Pulling latest changes from main branch..."
          # Backup live CMS store before git reset so admin edits are preserved
          [ -f data/cmsStore.json ] && cp data/cmsStore.json /tmp/cmsStore_runtime.json || true
          git fetch origin main
          git reset --hard origin/main
          # Smart merge of live CMS store with repository updates
          node scripts/merge-cms-runtime.js || true

          echo "📦 Installing dependencies..."
          npm install --omit=dev

          echo "🏗️ Building Next.js application..."
          npm run build

          echo "🔄 Reloading PM2 process..."
          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save

          echo "🔍 Checking local port 3000..."
          curl -I http://127.0.0.1:3000 || true

          echo "🌐 Restarting OpenLiteSpeed web server..."
          /usr/local/lsws/bin/lswsctrl restart || systemctl restart lsws || true

          echo "✅ Deployment completed successfully!"
